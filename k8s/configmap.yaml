apiVersion: v1
kind: ConfigMap
metadata:
  name: estri-config
  namespace: estri
  labels:
    app.kubernetes.io/name: estri
data:
  PORT: "8080"
  ENVIRONMENT: "production"
  JWT_EXPIRY_MINUTES: "480"
  COOKIE_SECURE: "true"
  # Set to your public ingress hostname.
  COOKIE_DOMAIN: "estri.example.com"
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@estri.example.com"
