# ServiceAccount used by the estri pod. Annotate it with your IAM role ARN
# to enable IRSA (EKS IAM Roles for Service Accounts) so the "IRSA / Pod
# Identity" AWS credential option in the admin UI works without any static
# keys. If you don't use EKS/IRSA, this ServiceAccount is still required
# (RBAC-wise harmless) — just leave the annotation out and rely on the
# "Assume Role" or "Static Keys" auth methods instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: estri
  namespace: estri
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/<ESTRI_IRSA_ROLE_NAME>"
  labels:
    app.kubernetes.io/name: estri
