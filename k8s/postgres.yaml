# OPTIONAL in-cluster PostgreSQL for demos/small deployments. For production,
# prefer a managed database (e.g. Amazon RDS/Aurora) and simply point
# DATABASE_URL in estri-secret at it instead of applying this file.
apiVersion: v1
kind: Secret
metadata:
  name: estri-postgres-secret
  namespace: estri
  labels:
    app.kubernetes.io/name: estri
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: estri
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: estri
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: estri-postgres
  namespace: estri
  labels:
    app.kubernetes.io/name: estri
    app.kubernetes.io/component: postgres
spec:
  serviceName: estri-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: estri
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estri
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: estri-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "estri"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "estri"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: estri-postgres
  namespace: estri
  labels:
    app.kubernetes.io/name: estri
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: estri
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
