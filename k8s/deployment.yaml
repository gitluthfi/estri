# estri is a single monolithic image (Go API + bundled React UI) — one
# Deployment, one Service. There is no separate frontend to deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: estri
  namespace: estri
  labels:
    app.kubernetes.io/name: estri
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: estri
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estri
    spec:
      serviceAccountName: estri
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: estri
          image: ghcr.io/your-org/estri:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: estri-config
            - secretRef:
                name: estri-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Go's multipart form parser spills large uploads to disk once
            # they exceed its in-memory buffer.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: estri
  namespace: estri
  labels:
    app.kubernetes.io/name: estri
spec:
  selector:
    app.kubernetes.io/name: estri
  ports:
    - name: http
      port: 8080
      targetPort: http
